name: Calendar

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
      - name: Running main.py
        run: python main.py
